<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Basic Gym Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💪 Super Basic Gym Tracker</h1>
            <p>Håll koll på dina träningspass</p>
        </header>

        <main>
            <section class="add-workout">
                <h2>Lägg till träningspass</h2>
                <form id="workoutForm">
                    <div class="form-group">
                        <label for="exercise">Övning:</label>
                        <input type="text" id="exercise" name="exercise" required placeholder="T.ex. Bänkpress">
                    </div>

                    <div class="form-group">
                        <label for="sets">Set:</label>
                        <input type="number" id="sets" name="sets" min="1" required placeholder="3">
                    </div>

                    <div class="form-group">
                        <label for="reps">Reps:</label>
                        <input type="number" id="reps" name="reps" min="1" required placeholder="10">
                    </div>

                    <div class="form-group">
                        <label for="weight">Vikt (kg):</label>
                        <input type="number" id="weight" name="weight" min="0" step="0.5" placeholder="80">
                    </div>

                    <div class="form-group">
                        <label for="date">Datum:</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <button type="submit" class="btn-primary">Lägg till</button>
                </form>
            </section>

            <section class="workout-history">
                <h2>Träningshistorik</h2>
                <div class="controls">
                    <button id="clearAll" class="btn-secondary">Rensa alla</button>
                </div>
                <div id="workoutList" class="workout-list">
                    <p class="empty-message">Ingen träningshistorik än. Lägg till ditt första träningspass!</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Data sparas lokalt i din webbläsare</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
